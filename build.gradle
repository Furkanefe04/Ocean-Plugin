
plugins {
    id 'java'
    id 'antlr'
    id 'org.jetbrains.intellij.platform' version '2.1.0'
}

group = 'ocean.plugin'
version = '1.0.1.2'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}


sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'src/generated/java']
        }
    }
}

dependencies {
    antlr "org.antlr:antlr4:4.13.1"
    implementation "org.antlr:antlr4-runtime:4.13.1"
    implementation "org.antlr:antlr4-intellij-adaptor:0.1"

    intellijPlatform {
        intellijIdeaCommunity "2023.3"
        bundledPlugin "com.intellij.java"
        instrumentationTools()
    }
    
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}


compileJava.dependsOn generateGrammarSource

intellijPlatform {
    pluginConfiguration {
        version = "1.0.1.2"
        ideaVersion {
            sinceBuild = "233"
            untilBuild = provider { null }
        }
    }

    publishing {
        token = providers.environmentVariable("PUBLISH_TOKEN")
            .orElse(providers.environmentVariable("JETBRAINS_MARKETPLACE_TOKEN"))
            .orElse(providers.gradleProperty("publishToken"))
            .orElse(providers.gradleProperty("intellijPlatform.publishing.token"))
            .orElse(provider {
                def tokenFile = rootProject.file(".publish-token")
                if (tokenFile.exists()) {
                    def content = tokenFile.text.trim()
                    return content.isEmpty() ? null : content
                }
                return null
            })
    }
}

test {
    useJUnitPlatform()
}

tasks.named('buildSearchableOptions') {
    enabled = false
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
